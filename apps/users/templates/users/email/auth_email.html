<!doctype html>
<html lang="fa" dir="rtl">
<body style="margin:0;padding:36px 16px;background-color:#f8fafc;direction:rtl;text-align:right;font-family:Arial,Helvetica,sans-serif;color:#1e293b;">
  <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;">
    <tr>
      <td style="padding:36px;">
        <img src="cid:teamup-logo" alt="لوگوی TeamUp" width="64" height="64" style="display:block;width:64px;height:64px;margin:0 0 24px;">
        <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;color:#0f172a;">{{ heading }}</h1>
        <p style="margin:0 0 12px;font-size:16px;line-height:1.8;color:#475569;">سلام {{ recipient_name }}،</p>
        <p style="margin:0 0 24px;font-size:16px;line-height:1.8;color:#475569;">{{ introduction }}</p>
        <table role="presentation" cellpadding="0" cellspacing="0">
          <tr>
            <td bgcolor="#4f46e5" style="border-radius:8px;">
              <a href="{{ action_url }}" style="display:inline-block;padding:13px 22px;color:#ffffff;text-decoration:none;font-size:16px;font-weight:bold;border-radius:8px;">{{ button_label }}</a>
            </td>
          </tr>
        </table>
        <p style="margin:24px 0 0;font-size:14px;line-height:1.8;color:#64748b;">{{ expiration_message }}</p>
        {% if note %}
        <p style="margin:12px 0 0;font-size:14px;line-height:1.8;color:#64748b;">{{ note }}</p>
        {% endif %}
        <p style="margin:24px 0 8px;font-size:14px;line-height:1.8;color:#64748b;">اگر دکمه کار نمی‌کند، پیوند زیر را در مرورگر باز کنید:</p>
        <p dir="ltr" style="margin:0;font-size:13px;line-height:1.6;text-align:left;word-break:break-all;">
          <a href="{{ action_url }}" style="color:#4f46e5;">{{ action_url }}</a>
        </p>
        <p style="margin:28px 0 0;padding-top:20px;border-top:1px solid #e2e8f0;font-size:14px;line-height:1.8;color:#64748b;">با احترام،<br>تیم TeamUp</p>
      </td>
    </tr>
  </table>
</body>
</html>
